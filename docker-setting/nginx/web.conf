# 手機網頁的靜態檔，加上把 /api 轉給後端。
# 主機上的反向代理（處理網域與 HTTPS）轉到這個容器的 WEB_PORT；那一層也要帶 Upgrade／Connection 標頭，WebSocket 才連得上。

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 1m;
    # 這個容器不知道外面的網址與 https；萬一要轉址，只給路徑，不給 http://localhost/…
    absolute_redirect off;

    # 即時通知（WebSocket），保持連線
    location = /api/ws {
        proxy_pass http://server:8787;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location /api/ {
        proxy_pass http://server:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # service worker 與 manifest 每次都要問新的，App 才會更新
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
    }

    # 檔名帶雜湊的建置產物可以快取很久
    location /_nuxt/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        # 地圖的 worker 是 .mjs；nginx 預設不認得，會當成下載檔（application/octet-stream），瀏覽器就拒絕執行，地圖整片空白
        location ~ \.mjs$ {
            default_type application/javascript;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
    }

    # 單頁 App：找不到的路徑都交給 index.html
    location / {
        # （/verify-email 這類頁面直接給 verify-email/index.html，不先轉址到加斜線的網址；信裡的連結才不會壞）
        try_files $uri $uri/index.html /index.html;
        add_header Cache-Control "no-cache";
    }
}
