# 線上部署（正式）— make up-prod／make deploy-prod（docker compose -f docker-compose_prod.yml …）
#
# 資料庫卷：db_data（與 docker-compose.yml 共用）。
# 相較 docker-compose.yml：每個服務都有記憶體上限。
services:
  web:
    container_name: ${COMPOSE_PROJECT_NAME}_web
    build:
      context: .
      dockerfile: pwa/Dockerfile
    restart: always
    ports:
      - '${WEB_PORT}:80'
    depends_on:
      server:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128M
    networks:
      - app-network

  server:
    container_name: ${COMPOSE_PROJECT_NAME}_server
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: always
    environment:
      DATABASE_URL: postgres://goblin:${POSTGRES_PASSWORD}@postgres:5432/goblin
      PORT: 8787
      APP_URL: ${APP_URL}
      TRUST_PROXY: "true"
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_SUBJECT: ${VAPID_SUBJECT}
      RESEND_API_KEY: ${RESEND_API_KEY}
      MAIL_FROM: ${MAIL_FROM}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - app-network

  postgres:
    container_name: ${COMPOSE_PROJECT_NAME}_postgres
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: goblin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: goblin
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U goblin -d goblin"]
      interval: 30s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  db_data:
