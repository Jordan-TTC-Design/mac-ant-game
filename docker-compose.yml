# 線上部署（一般）— make up／make deploy（docker compose -f docker-compose.yml …）
#
# 對外只開 web（WEB_PORT），網域與 HTTPS 由主機上的反向代理處理；server 與 postgres 只在內部網路。
# 資料庫卷：db_data（與 docker-compose_prod.yml 共用，正式主機上互相切換不會遺失資料）。
# 本機試跑整套請用 docker-compose_dev.yaml，它有獨立的 db_data_dev。
services:
  web:
    container_name: ${COMPOSE_PROJECT_NAME}_web
    build:
      context: .
      dockerfile: pwa/Dockerfile
    restart: always
    ports:
      - '${WEB_PORT}:80'
    depends_on:
      server:
        condition: service_healthy
    networks:
      - app-network

  server:
    container_name: ${COMPOSE_PROJECT_NAME}_server
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: always
    environment:
      DATABASE_URL: postgres://goblin:${POSTGRES_PASSWORD}@postgres:5432/goblin
      PORT: 8787
      APP_URL: ${APP_URL}
      TRUST_PROXY: "true"
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_SUBJECT: ${VAPID_SUBJECT}
      RESEND_API_KEY: ${RESEND_API_KEY}
      MAIL_FROM: ${MAIL_FROM}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      BACKUP_DIR: /backups
    volumes:
      - db_backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network

  postgres:
    container_name: ${COMPOSE_PROJECT_NAME}_postgres
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: goblin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: goblin
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U goblin -d goblin"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  db_data:
  db_backups:
